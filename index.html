<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WarMaster — Masterización Online</title>

  <style>
    :root{
      --bg0:#07080c;
      --bg1:#0b0e16;
      --text:#e9edf7;
      --muted: rgba(233,237,247,.72);
      --a:#8a5cff;
      --b:#00d7ff;
      --c:#00ff9a;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 10%, rgba(138,92,255,.22), transparent 55%),
        radial-gradient(800px 500px at 90% 15%, rgba(0,215,255,.18), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
      border-bottom:1px solid rgba(255,255,255,.1);
    }

    .brand{
      font-size:22px;
      font-weight:bold;
    }

    .grad{
      background:linear-gradient(90deg,#8a5cff,#00d7ff,#00ff9a);
      -webkit-background-clip:text;
      color:transparent;
    }

    .btn{
      padding:10px 16px;
      border-radius:14px;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    .btn.primary{
      background:linear-gradient(90deg,#8a5cff,#00d7ff);
      color:#000;
    }

    .hero{
      max-width:900px;
      margin:100px auto;
      padding:0 20px;
      text-align:center;
    }

    .hero h1{
      font-size:48px;
      margin-bottom:18px;
    }

    .hero p{
      color:var(--muted);
      line-height:1.6;
      margin-bottom:30px;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">War<span class="grad">Master</span></div>
  <button class="btn primary" id="btnLogin">Iniciar sesión</button>
</header>

<section class="hero">
  <h1>Masteriza tu música con <span class="grad">calidad profesional</span></h1>
  <p>
    WarMaster es una plataforma de masterización online.
    Sube tu track y obtén un sonido listo para publicar.
  </p>

  <div class="actions">
    <button class="btn primary" id="btnLoginHero">Entrar al dashboard</button>
  </div>
</section>

<!-- ========================= -->
<!-- LOGIN FAKE (NO CAMBIA UI) -->
<!-- ========================= -->
<script>
  function loginFake(){
    localStorage.setItem("warmaster_logged", "true");
    window.location.href = "dashboard.html";
  }

  document.getElementById("btnLogin")?.addEventListener("click", loginFake);
  document.getElementById("btnLoginHero")?.addEventListener("click", loginFake);
</script>

</body>
</html>
