<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masterizado</title>

<style>
body {
  background:#0e0e0e;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box {
  background:#171717;
  border:1px solid #2a2a2a;
  border-radius:12px;
  padding:22px;
  width:min(520px, 92vw);
}
h1 { font-size:20px; margin-bottom:10px; }
input, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}
input {
  background:#101010;
  color:#ddd;
  border:1px solid #2a2a2a;
}
button {
  background:#00e5ff;
  font-size:16px;
  cursor:pointer;
}
button:disabled { opacity:0.6; }
.status {
  margin-top:12px;
  padding:12px;
  background:#101010;
  border:1px solid #2a2a2a;
  border-radius:8px;
  white-space:pre-wrap;
}
.small {
  font-size:12px;
  color:#aaa;
  margin-top:8px;
}
</style>
</head>

<body>
<div class="box">
  <h1>Masterizar audio</h1>

  <input type="file" id="fileInput" accept="audio/*">
  <button id="btn">Masterizar y descargar WAV</button>

  <div class="status" id="status">
    Puedes subir MP3 o WAV.
  </div>

  <div class="small">
    Si subes MP3, la web lo convierte a WAV automáticamente.
  </div>
</div>

<script>
const BASE_URL = "https://master-backend-idon.onrender.com";
const MASTER_URL = BASE_URL + "/master";

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

function setStatus(t) {
  statusEl.textContent = t;
}

/* Convierte AudioBuffer → WAV */
function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length * numChannels * 2;
  const wav = new ArrayBuffer(44 + length);
  const view = new DataView(wav);

  function writeString(o, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i));
  }

  let offset = 0;
  writeString(offset, "RIFF"); offset += 4;
  view.setUint32(offset, 36 + length, true); offset += 4;
  writeString(offset, "WAVE"); offset += 4;
  writeString(offset, "fmt "); offset += 4;
  view.setUint32(offset, 16, true); offset += 4;
  view.setUint16(offset, 1, true); offset += 2;
  view.setUint16(offset, numChannels, true); offset += 2;
  view.setUint32(offset, sampleRate, true); offset += 4;
  view.setUint32(offset, sampleRate * numChannels * 2, true); offset += 4;
  view.setUint16(offset, numChannels * 2, true); offset += 2;
  view.setUint16(offset, 16, true); offset += 2;
  writeString(offset, "data"); offset += 4;
  view.setUint32(offset, length, true); offset += 4;

  for (let i = 0; i < buffer.length; i++) {
    for (let c = 0; c < numChannels; c++) {
      let sample = buffer.getChannelData(c)[i];
      sample = Math.max(-1, Math.min(1, sample));
      view.setInt16(offset, sample * 32767, true);
      offset += 2;
    }
  }

  return new Blob([view], { type: "audio/wav" });
}

btn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) {
    setStatus("Primero elige un archivo.");
    return;
  }

  btn.disabled = true;
  setStatus("Preparando audio...");

  let wavBlob;

  if (file.type.includes("mp3")) {
    setStatus("Convirtiendo MP3 a WAV en la web...");
    const arrayBuffer = await file.arrayBuffer();
    const ctx = new AudioContext();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    wavBlob = audioBufferToWav(audioBuffer);
  } else {
    wavBlob = file;
  }

  setStatus("Enviando WAV al servidor...");

  const formData = new FormData();
  formData.append("file", wavBlob, "audio.wav");

  try {
    const res = await fetch(MASTER_URL, {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const txt = await res.text();
      setStatus("No se pudo exportar WAV.\nMotivo:\n" + txt);
      btn.disabled = false;
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "master.wav";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    setStatus("Listo ✅ WAV descargado");
  } catch (e) {
    setStatus("Error de conexión.\n" + e.message);
  }

  btn.disabled = false;
};
</script>
</body>
</html>
