<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Master by Waren</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}
.wrap{max-width:560px;margin:auto;padding:20px}
h1{text-align:center}
.card{
  background:#161616;
  border-radius:14px;
  padding:16px;
  box-shadow:0 0 30px rgba(0,0,0,.6)
}
input,button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:none
}
button{
  background:#00ffae;
  color:#000;
  font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.5}
#wave{margin-top:10px}
.progress{
  margin-top:12px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
  height:14px;
  display:none
}
.bar{
  height:100%;
  width:0%;
  background:#00ffae;
  transition:width .2s
}
.msg{font-size:12px;opacity:.7;margin-top:8px}
</style>
</head>

<body>
<div class="wrap">
<h1>MASTER BY WAREN</h1>

<div class="card">
  <input type="file" id="file" accept="audio/*"/>
  <div id="wave"></div>

  <button id="export">⬇️ Exportar WAV</button>

  <div class="progress" id="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="msg" id="msg"></div>
</div>
</div>

<script src="https://unpkg.com/wavesurfer.js@7"></script>

<script>
/* =========================
   CONFIGURACIÓN CORRECTA
========================= */
const BACKEND_BASE = "https://master-backend-ab91.onrender.com";
const EXPORT_URL = BACKEND_BASE + "/export-wav";

/* =========================
   WAVEFORM
========================= */
const wave = WaveSurfer.create({
  container:"#wave",
  height:100,
  waveColor:"#333",
  progressColor:"#00ffae",
  barWidth:2,
  normalize:true
});

const fileInput = document.getElementById("file");
fileInput.onchange = () => {
  const f = fileInput.files[0];
  if(!f) return;
  wave.load(URL.createObjectURL(f));
};

/* =========================
   EXPORT CON RETRY
========================= */
const btn = document.getElementById("export");
const bar = document.getElementById("bar");
const progress = document.getElementById("progress");
const msg = document.getElementById("msg");

async function exportWav(retry=true){
  if(!fileInput.files[0]){
    alert("Sube un audio primero");
    return;
  }

  btn.disabled = true;
  msg.textContent = "Conectando al servidor...";
  progress.style.display="block";
  bar.style.width="10%";

  const fd = new FormData();
  fd.append("audio", fileInput.files[0]);
  fd.append("settings", "{}");

  try{
    const res = await fetch(EXPORT_URL, {
      method:"POST",
      body:fd
    });

    if(!res.ok) throw new Error("HTTP " + res.status);

    bar.style.width="90%";
    msg.textContent = "Descargando WAV...";

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "master.wav";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    bar.style.width="100%";
    msg.textContent = "Listo ✅";

  }catch(e){
    console.error(e);

    if(retry){
      msg.textContent = "Servidor despertando... reintentando";
      setTimeout(()=>exportWav(false),3000);
      return;
    }

    alert("Error de conexión con el backend.\nIntenta nuevamente en 10 segundos.");
    msg.textContent = "Error de conexión";
  }finally{
    setTimeout(()=>{
      btn.disabled=false;
      progress.style.display="none";
      bar.style.width="0%";
    },1500);
  }
}

btn.onclick = ()=>exportWav(true);
</script>

</body>
</html>
