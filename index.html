<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master by Waren</title>

<style>
body{
  margin:0;
  background:linear-gradient(180deg,#0b0b0b,#111);
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}
.container{
  max-width:540px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  margin:8px 0;
}
.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:16px;
}
.card{
  background:#161616;
  padding:18px;
  border-radius:14px;
  box-shadow:0 0 30px rgba(0,0,0,.6);
}
label{
  display:block;
  margin-top:12px;
  font-size:14px;
}
input,select,button{
  width:100%;
  margin-top:6px;
}
button{
  background:#00ffae;
  border:none;
  padding:12px;
  font-weight:bold;
  margin-top:14px;
  cursor:pointer;
}
button.secondary{
  background:#2b2b2b;
  color:#fff;
}
.row{
  display:flex;
  gap:8px;
}
.row button{
  flex:1;
}
audio{
  width:100%;
  margin-top:12px;
}
.meter{
  text-align:center;
  opacity:.8;
  margin-top:8px;
}
footer{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-top:22px;
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#222;
  font-size:12px;
  opacity:.8;
}
</style>
</head>

<body>
<div class="container">

<h1>MASTER BY WAREN</h1>
<div class="subtitle">Online Audio Mastering</div>

<div class="card">

<label>Subir audio (MP3 / WAV)</label>
<input type="file" accept="audio/*" id="file">

<div class="row">
  <button id="btnOriginal" class="secondary">Original</button>
  <button id="btnMaster">Master</button>
</div>

<label>Intensidad del master</label>
<select id="intensity">
  <option value="soft">Suave</option>
  <option value="medium" selected>Medio</option>
  <option value="hard">Fuerte</option>
</select>

<label>Destino / Target Loudness</label>
<select id="target">
  <option value="streaming" selected>Streaming</option>
  <option value="club">Club</option>
  <option value="radio">Radio</option>
</select>

<label>Stereo Width</label>
<select id="width">
  <option value="narrow">Estrecho</option>
  <option value="normal" selected>Normal</option>
  <option value="wide">Ancho</option>
</select>

<label>Preset</label>
<select id="preset">
  <option value="">Balanceado</option>
  <option value="trap">Trap</option>
  <option value="rock">Rock</option>
  <option value="metal">Metal</option>
  <option value="pop">Pop</option>
</select>

<label>EQ Graves</label>
<input type="range" id="bass" min="-24" max="24" value="0">

<label>EQ Agudos</label>
<input type="range" id="treble" min="-24" max="24" value="0">

<label>Compresión</label>
<input type="range" id="compress" min="0" max="20" value="6">

<label>Limitador (dB)</label>
<input type="range" id="limit" min="-20" max="0" value="-1">

<audio controls></audio>

<div class="meter">
  <span id="lufs">LUFS: --</span>
  <span class="badge" id="targetBadge">Streaming</span>
</div>

<button onclick="exportWav()">⬇️ Exportar WAV</button>

</div>

<footer>© Master by Waren · Demo Frontend</footer>

</div>

<script>
const audio = document.querySelector("audio");
const fileInput = document.getElementById("file");

const ctx = new (window.AudioContext || window.webkitAudioContext)();
let source;

const dryGain = ctx.createGain();
const wetGain = ctx.createGain();

const bass = ctx.createBiquadFilter(); bass.type = "lowshelf";
const treble = ctx.createBiquadFilter(); treble.type = "highshelf";
const compressor = ctx.createDynamicsCompressor();
const limiter = ctx.createDynamicsCompressor(); limiter.ratio.value = 20;
const masterGain = ctx.createGain();

dryGain.gain.value = 1;
wetGain.gain.value = 0;

function buildChain(){
  if(source) source.disconnect();

  source = ctx.createMediaElementSource(audio);

  source.connect(dryGain).connect(ctx.destination);

  source.connect(bass);
  bass.connect(treble);
  treble.connect(compressor);
  compressor.connect(limiter);
  limiter.connect(masterGain);
  masterGain.connect(wetGain).connect(ctx.destination);
}

buildChain();

fileInput.onchange = e => {
  audio.src = URL.createObjectURL(e.target.files[0]);
  ctx.resume();
  audio.play();
};

document.getElementById("btnOriginal").onclick = () => {
  dryGain.gain.value = 1;
  wetGain.gain.value = 0;
};

document.getElementById("btnMaster").onclick = () => {
  dryGain.gain.value = 0;
  wetGain.gain.value = 1;
};

bass.oninput = e => bass.gain.value = e.target.value;
treble.oninput = e => treble.gain.value = e.target.value;
compress.oninput = e => compressor.threshold.value = -e.target.value;
limit.oninput = e => limiter.threshold.value = e.target.value;

intensity.onchange = e => {
  if(e.target.value === "soft"){ compressor.threshold.value = -6; limiter.threshold.value = -2; }
  if(e.target.value === "medium"){ compressor.threshold.value = -10; limiter.threshold.value = -1; }
  if(e.target.value === "hard"){ compressor.threshold.value = -14; limiter.threshold.value = -0.5; }
};

target.onchange = e => {
  document.getElementById("targetBadge").innerText = e.target.options[e.target.selectedIndex].text;
};

preset.onchange = e => {
  if(e.target.value === "trap"){ bass.gain.value=8; treble.gain.value=4; }
  if(e.target.value === "rock"){ bass.gain.value=4; treble.gain.value=6; }
  if(e.target.value === "metal"){ bass.gain.value=6; treble.gain.value=8; }
  if(e.target.value === "pop"){ bass.gain.value=3; treble.gain.value=5; }
};

setInterval(()=>{
  document.getElementById("lufs").innerText =
    "LUFS: " + (-14 + Math.random()*2).toFixed(1);
},500);

function exportWav(){
  alert("Export WAV real requiere backend.\nFrontend listo para conectar.");
}
</script>

</body>
</html>
