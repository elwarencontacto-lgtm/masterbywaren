<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER BY WAREN</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#0b0b0b;
  color:#fff;
}
h1{
  text-align:center;
  margin:20px 0;
}
.card{
  max-width:520px;
  margin:20px auto;
  background:#151515;
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#00ffa2;
  color:#000;
  font-size:18px;
  font-weight:700;
}
button:disabled{
  opacity:.5;
}
input[type=file]{
  width:100%;
  margin-bottom:16px;
}
.progress{
  width:100%;
  height:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}
.progress div{
  height:100%;
  width:0%;
  background:#00ffa2;
  transition:width .3s;
}
.small{
  font-size:12px;
  opacity:.7;
  margin-top:10px;
}
canvas{
  width:100%;
  height:120px;
  background:#0f0f0f;
  border-radius:12px;
}
label{
  font-size:13px;
}
select{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<h1>MASTER BY WAREN</h1>

<div class="card">

  <label>Subir audio (MP3 / WAV)</label>
  <input type="file" id="audioFile" accept="audio/*">

  <canvas id="wave"></canvas>

  <label>Intensidad</label>
  <select id="intensity">
    <option value="soft">Suave</option>
    <option value="medium" selected>Media</option>
    <option value="hard">Fuerte</option>
  </select>

  <label>Destino</label>
  <select id="target">
    <option value="streaming" selected>Streaming</option>
    <option value="radio">Radio</option>
    <option value="club">Club</option>
  </select>

  <label>Ancho estéreo</label>
  <select id="width">
    <option value="narrow">Angosto</option>
    <option value="normal" selected>Normal</option>
    <option value="wide">Amplio</option>
  </select>

  <button id="exportBtn">⬇ Exportar WAV</button>

  <div class="progress"><div id="bar"></div></div>

  <div class="small" id="status">Esperando archivo…</div>

  <div class="small">
    • El primer export puede tardar (Render dormido).<br>
    • El procesamiento es real (FFmpeg backend).
  </div>

</div>

<script>
/* ===============================
   CONFIG
================================ */
const BACKEND = "https://master-backend-ab91.onrender.com";

/* ===============================
   ELEMENTOS
================================ */
const fileInput = document.getElementById("audioFile");
const exportBtn = document.getElementById("exportBtn");
const bar = document.getElementById("bar");
const statusTxt = document.getElementById("status");
const canvas = document.getElementById("wave");
const ctx = canvas.getContext("2d");

/* ===============================
   WAVE VISUAL
================================ */
function drawWave(file){
  const reader = new FileReader();
  reader.onload = async () => {
    const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const buf = await audioCtx.decodeAudioData(reader.result);
    const data = buf.getChannelData(0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#00ffa2";
    ctx.beginPath();
    const step = Math.floor(data.length / canvas.width);
    for(let i=0;i<canvas.width;i++){
      const v = data[i*step] * 0.5;
      const y = canvas.height/2 + v * canvas.height;
      ctx.lineTo(i,y);
    }
    ctx.stroke();
  };
  reader.readAsArrayBuffer(file);
}

/* ===============================
   UTIL
================================ */
function setProgress(p,msg){
  bar.style.width = p+"%";
  statusTxt.textContent = msg;
}

async function wakeBackend(){
  try{
    await fetch(BACKEND + "/health", { cache:"no-store" });
    return true;
  }catch{
    return false;
  }
}

/* ===============================
   EVENTS
================================ */
fileInput.addEventListener("change", e=>{
  if(e.target.files[0]){
    drawWave(e.target.files[0]);
    setProgress(0,"Archivo cargado");
  }
});

exportBtn.addEventListener("click", async ()=>{
  if(!fileInput.files[0]){
    alert("Selecciona un archivo");
    return;
  }

  exportBtn.disabled = true;

  setProgress(5,"Conectando al servidor…");

  const alive = await wakeBackend();
  if(!alive){
    alert("No se pudo conectar al backend.\nAbre primero:\n"+BACKEND+"/health");
    exportBtn.disabled = false;
    return;
  }

  setProgress(15,"Subiendo audio…");

  const settings = {
    intensity: document.getElementById("intensity").value,
    target: document.getElementById("target").value,
    width: document.getElementById("width").value,
    bands: []
  };

  const form = new FormData();
  form.append("audio", fileInput.files[0]);
  form.append("settings", JSON.stringify(settings));

  try{
    const res = await fetch(BACKEND + "/export-wav", {
      method:"POST",
      body:form
    });

    if(!res.ok){
      const t = await res.text();
      throw new Error(t);
    }

    setProgress(80,"Descargando WAV…");

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "master.wav";
    a.click();
    URL.revokeObjectURL(url);

    setProgress(100,"Listo ✔");

  }catch(err){
    alert("Error exportando:\n"+err.message);
    setProgress(0,"Error");
  }

  exportBtn.disabled = false;
});
</script>

</body>
</html>
