<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Audio Mastering</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #0e0e0e;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: #1a1a1a;
    padding: 30px;
    border-radius: 10px;
    width: 100%;
    max-width: 420px;
    text-align: center;
}
input[type="file"] {
    margin: 20px 0;
}
button {
    width: 100%;
    padding: 12px;
    background: #00e5ff;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}
button:disabled {
    opacity: 0.5;
}
.status {
    margin-top: 15px;
}
</style>
</head>

<body>
<div class="container">
    <h2>Masterizado WAV</h2>

    <input type="file" id="audioFile" accept="audio/*">
    <button id="sendBtn">Masterizar</button>

    <div class="status" id="status"></div>
</div>

<script>
const backendURL = "https://master-backend-ab91.onrender.com/master";

const button = document.getElementById("sendBtn");
const status = document.getElementById("status");

button.onclick = async () => {
    const fileInput = document.getElementById("audioFile");
    if (!fileInput.files.length) {
        alert("Selecciona un archivo");
        return;
    }

    button.disabled = true;
    status.textContent = "Procesando audio...";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const response = await fetch(backendURL, {
            method: "POST",
            body: formData
        });

        if (!response.ok) throw new Error("Error en el backend");

        // 🔑 CLAVE: descargar como BLOB
        const blob = await response.blob();

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "master.wav";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        status.textContent = "Master listo ✅";
    } catch (err) {
        status.textContent = "Error al exportar WAV ❌";
        console.error(err);
    }

    button.disabled = false;
};
</script>
</body>
</html>
