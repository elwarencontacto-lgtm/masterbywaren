<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Masterizado</title>

<style>
body {
  background:#0e0e0e;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box {
  background:#171717;
  border:1px solid #2a2a2a;
  border-radius:12px;
  padding:22px;
  width:min(520px, 92vw);
}
h1 {
  font-size:20px;
  margin-bottom:12px;
}
input, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}
input {
  background:#101010;
  color:#ddd;
  border:1px solid #2a2a2a;
}
button {
  background:#00e5ff;
  font-size:16px;
  cursor:pointer;
}
button:disabled {
  opacity:0.6;
}
.status {
  margin-top:12px;
  padding:12px;
  background:#101010;
  border:1px solid #2a2a2a;
  border-radius:8px;
  white-space:pre-wrap;
}
</style>
</head>

<body>
<div class="box">
  <h1>Masterizar audio (WAV)</h1>

  <input type="file" id="fileInput" accept="audio/*">
  <button id="btn">Masterizar y descargar WAV</button>

  <div class="status" id="status">
    Listo. Sube un archivo WAV.
  </div>
</div>

<script>
/* 🔴 TU URL REAL DE RENDER */
const BASE_URL = "https://master-backend-idon.onrender.com";
/* 🔴 LA PUERTA CORRECTA */
const MASTER_URL = BASE_URL + "/master";

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

function setStatus(text) {
  statusEl.textContent = text;
}

btn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) {
    setStatus("Primero elige un archivo.");
    return;
  }

  btn.disabled = true;
  setStatus("Enviando audio al servidor...");

  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch(MASTER_URL, {
      method: "POST",
      body: formData
    });

    if (!response.ok) {
      const text = await response.text();
      setStatus("No se pudo exportar WAV.\nMotivo:\n" + text);
      btn.disabled = false;
      return;
    }

    const blob = await response.blob();

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "master.wav";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    setStatus("Listo ✅ WAV descargado");
  } catch (err) {
    setStatus("Error de conexión.\n" + err.message);
  }

  btn.disabled = false;
};
</script>
</body>
</html>
